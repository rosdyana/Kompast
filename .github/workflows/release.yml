name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # Build and scan every image even if one fails, so a release run reports
      # all four results (publish-installer still needs all of them to pass).
      fail-fast: false
      matrix:
        service: [web, collab, worker, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kompast-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the exact pushed manifest (by digest), not a mutable tag. Gates the
      # job, so a failing scan marks the release red; the image is already pushed
      # by this point, so treat a red run as "do not deploy this tag".
      - name: Scan pushed image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/kompast-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Publishes the installer and its runtime files as a GitHub Release — only
  # after every image above was built, pushed AND passed its Trivy scan, so
  # `releases/latest` (what install.sh and `kompast upgrade` use by default)
  # never points at images that failed the gate. install.sh is stamped with
  # its own version, so it installs the matching runtime files and image tag;
  # SHA256SUMS is what the installer and the `kompast` wrapper verify against.
  publish-installer:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp installer and checksum runtime files
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir dist
          sed "s/^KOMPAST_RELEASE=\"\"$/KOMPAST_RELEASE=\"$tag\"/" infra/install.sh > dist/install.sh
          grep -qx "KOMPAST_RELEASE=\"$tag\"" dist/install.sh
          cp infra/docker-compose.yml infra/Caddyfile.example infra/backup.sh infra/gcs-cors.json dist/
          # GitHub renames release assets that start with a dot; install.sh asks for "env.example".
          cp infra/.env.example dist/env.example
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
