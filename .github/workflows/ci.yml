name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the whole workflow: CI only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kompast
          POSTGRES_USER: kompast_admin
          POSTGRES_PASSWORD: ci-admin-pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kompast_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      PORT: "3000"
      DATABASE_ADMIN_URL: postgres://kompast_admin:ci-admin-pass@localhost:5432/kompast
      DATABASE_URL: postgres://kompast_app:ci-app-pass@localhost:5432/kompast
      # adminDb runs as the non-superuser BYPASSRLS service role in CI, like production (migrate creates it).
      DATABASE_SERVICE_URL: postgres://kompast_service:ci-service-pass@localhost:5432/kompast
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/kompast-ci-attachments
      COLLAB_WS_URL: ws://localhost:1234
      COLLAB_INTERNAL_PORT: "1234"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact patched release (CVE-2026-111497): a bare "22" can resolve to an older cached 22.x on the runner.
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build on high or critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm build

      # apps/web's TanStack Router route tree (src/routeTree.gen.ts) is
      # gitignored and only generated by `vite build`/`vite dev` — typecheck
      # must run after build on a fresh checkout or every route param type
      # collapses to never/{}.
      - run: pnpm typecheck

      - run: pnpm lint
        continue-on-error: true # no lint config yet — tracked for P0 hardening

      - run: pnpm --filter @kompast/db migrate

      - run: pnpm test

  # Builds every deployable image (no push), so a broken Dockerfile or base
  # image fails the PR instead of the release. `pnpm build` and the tests
  # never touch the built image — e.g. a Dependabot bump to node:25-alpine
  # (no corepack) passed every other check and only broke at release time.
  docker-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, collab, worker, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build kompast-${{ matrix.service }} (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha

