name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the whole workflow: CI only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kompast
          POSTGRES_USER: kompast_admin
          POSTGRES_PASSWORD: ci-admin-pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kompast_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      PORT: "3000"
      DATABASE_ADMIN_URL: postgres://kompast_admin:ci-admin-pass@localhost:5432/kompast
      DATABASE_URL: postgres://kompast_app:ci-app-pass@localhost:5432/kompast
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/kompast-ci-attachments
      COLLAB_WS_URL: ws://localhost:1234
      COLLAB_INTERNAL_PORT: "1234"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build on high or critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm build

      # apps/web's TanStack Router route tree (src/routeTree.gen.ts) is
      # gitignored and only generated by `vite build`/`vite dev` — typecheck
      # must run after build on a fresh checkout or every route param type
      # collapses to never/{}.
      - run: pnpm typecheck

      - run: pnpm lint
        continue-on-error: true # no lint config yet — tracked for P0 hardening

      - run: pnpm --filter @kompast/db migrate

      - run: pnpm test
