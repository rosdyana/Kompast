version: 2

updates:
  # pnpm workspace: Dependabot reads the root pnpm-lock.yaml and updates
  # every apps/* and packages/* manifest from there.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # npm undici's major must match the undici bundled in the Node base
      # image (Node 22 → undici 7): net-guard.ts passes an undici Agent as the
      # dispatcher to Node's built-in fetch, and an undici 8 Agent is rejected
      # there ("invalid onRequestStart method"). Move together with the Node LTS bump.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # The service Dockerfiles live in infra/ (see infra/Dockerfile.*).
  - package-ecosystem: docker
    directories:
      - "/infra"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # A new Node major for the base image is a deliberate, tested move
      # between LTS lines (odd majors never become LTS; Node 25 dropped
      # corepack, which every Dockerfile needs). Minor/patch updates still flow.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
